<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve Seller | displaystore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 700px;">
    <h2 class="mb-4">Approve Seller Account</h2>

    <div class="card">
        <div class="card-body">
            <h5 class="card-title">{{ profile.user.username }}</h5>
            <p class="card-text">User joined on {{ profile.user.date_joined|date:"M d, Y" }}.</p>
            <p class="card-text">This user has requested a seller account.</p>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-success">Approve Seller</button>
                <a class="btn btn-secondary" href="{% url 'seller_approvals' %}">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% include 'screeNova/footer.html' %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
